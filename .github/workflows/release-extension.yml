# Publishes the store upload package whenever extension/manifest.json on main
# has a version that hasn't been released yet (or when run by hand from the
# Actions tab). The zip appears on the Releases page, ready for Edge Add-ons.
name: Release extension

on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/release-extension.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Test parsers
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Read version, skip if already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./extension/manifest.json').version")
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          if gh release view "xray-v$VER" >/dev/null 2>&1; then
            echo "xray-v$VER is already released; bump the version in extension/manifest.json to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip (manifest at the root, no docs)
        if: steps.ver.outputs.skip != 'true'
        run: |
          cd extension
          zip -r "../adlytics-xray-${VERSION}.zip" . -x "README.md"
          cd ..
          unzip -l "adlytics-xray-${VERSION}.zip"

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xray-v${VERSION}" "adlytics-xray-${VERSION}.zip" --target "$GITHUB_SHA" \
            --title "AdLytics Xray ${VERSION}" \
            --notes "Upload **adlytics-xray-${VERSION}.zip** to Microsoft Edge Add-ons (Partner Center → Update → Packages). For a manual install: unzip, open edge://extensions, turn on Developer mode, Load unpacked."
